# Lab 9 - OpenVPN server (Kali). Files live in /etc/openvpn/server/
# Start:  sudo systemctl start openvpn-server@server
port 1194
proto udp
dev tun
topology subnet
server 10.88.88.0 255.255.255.0

ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/kali-vpn-server.crt
key  /etc/openvpn/server/kali-vpn-server.key
dh none
# Per-client TLS key wrapping (replaces the shared ta.key/tc.key)
tls-crypt-v2 /etc/openvpn/server/tc2-server.key
tls-version-min 1.2

# Data-channel ciphers the server accepts. A normal client negotiates the
# first common one (AES-256-GCM); the CBC/DES entries are only used when a
# client asks for them explicitly (lab 9, task 4.3).
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-128-CBC:DES-EDE-CBC:DES-CBC
# DES needs the OpenSSL legacy provider
providers legacy default
# HMAC for CBC ciphers is not negotiated: it must be the same here and in
# client.ovpn. After changing it: sudo systemctl restart openvpn-server@server
auth SHA1

keepalive 10 120
user nobody
group nogroup
persist-tun
status /var/log/openvpn/openvpn-status.log
verb 3
explicit-exit-notify 1
