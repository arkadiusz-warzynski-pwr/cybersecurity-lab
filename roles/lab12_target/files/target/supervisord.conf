; Process supervisor for prod-app-01: reporting cron, FTP and the salary
; application.
[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:vsftpd]
command=/usr/local/sbin/vsftpd /etc/vsftpd.conf
autorestart=true

[program:salary]
command=/opt/java/openjdk/bin/java -Dcom.sun.jndi.ldap.object.trustURLCodebase=true -Dlog4j2.formatMsgNoLookups=false -jar /app/app.jar --server.port=9876
directory=/app
user=app
autorestart=true
