; Lab 12 target: multi-process container.
;  - salary app (vector B) runs NON-ROOT (user app): the foothold for the
;    Log4Shell -> creds -> writable-cron privesc -> root chain.
;  - cron (vector C) runs as root; its job runs the group-writable helper.
;  - vsftpd (vector A, standalone) runs as root (its startup won't run non-root);
;    A is a separate exercise, so this doesn't affect the chain.
; sshd is NOT started here — the student enables it during task 3.5.
[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:vsftpd]
command=/usr/local/sbin/vsftpd /etc/vsftpd.conf
autorestart=true

[program:salary]
command=/opt/java/openjdk/bin/java -Dcom.sun.jndi.ldap.object.trustURLCodebase=true -Dlog4j2.formatMsgNoLookups=false -jar /app/app.jar --server.port=9876
directory=/app
user=app
autorestart=true
