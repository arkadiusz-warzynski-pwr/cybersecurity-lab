<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center min-vh-100 py-5 gap-4">

<div class="card p-4 shadow" style="width: 700px;">
    <h5 class="card-title text-center mb-3">Employee Database</h5>
    <table class="table table-sm table-striped mb-0">
        <thead>
        <tr>
            <th>ID</th>
            <th class="text-nowrap">Full Name</th>
            <th>Department</th>
            <th>Email</th>
            <th>Salary</th>
        </tr>
        </thead>
        <tbody id="records-body"></tbody>
        <tfoot>
        <tr>
            <td colspan="5" class="p-0">
                <div class="alert alert-warning text-center fw-bold mb-0 rounded-0" id="records-info">Loading data...</div>
            </td>
        </tr>
        <tr>
            <td colspan="5">
                <form id="login-form" class="d-flex gap-2 align-items-end justify-content-center flex-wrap py-2">
                    <div>
                        <label for="login-username" class="form-label mb-0 small">Username</label>
                        <input id="login-username" type="text" name="username" class="form-control form-control-sm" required>
                    </div>
                    <div>
                        <label for="login-password" class="form-label mb-0 small">Password</label>
                        <input id="login-password" type="password" name="password" class="form-control form-control-sm" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Log in</button>
                </form>
            </td>
        </tr>
        <tr id="login-info-row" class="d-none">
            <td colspan="5" class="p-0">
                <div class="alert alert-secondary small mb-0 rounded-0" id="login-info"></div>
            </td>
        </tr>
        </tfoot>
    </table>
</div>

<script src="/js/app.js"></script>

</body>
</html>
