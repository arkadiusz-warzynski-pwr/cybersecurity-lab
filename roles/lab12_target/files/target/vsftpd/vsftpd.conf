# vsftpd 2.3.4 (vector A) — a STANDALONE finding, separate from the Log4Shell
# privesc chain. It runs as root (its libcap startup path won't run non-root);
# vector A is its own exercise (find the service, identify CVE-2011-2523,
# exploit the backdoor), so its shell privilege does not affect the B->C chain.
listen=YES
listen_port=21
anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp
# local_enable=YES is required for the CVE-2011-2523 backdoor: the ":)" trigger
# is checked in the login path (privops.c). In anonymous-only mode prelogin.c
# rejects a non-anon "USER x:)" with 530 before the backdoor code is reached.
local_enable=YES
secure_chroot_dir=/usr/share/empty
nopriv_user=nobody
dirmessage_enable=YES
xferlog_enable=NO
# No custom ftpd_banner: the default "220 (vsFTPd 2.3.4)" banner exposes the
# version, which the recon/fingerprinting task (part 1) relies on.
background=NO
