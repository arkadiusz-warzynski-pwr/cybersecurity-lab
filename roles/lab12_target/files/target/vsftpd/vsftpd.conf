# FTP service for prod-app-01.
listen=YES
listen_port=21
anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp
# Local accounts stay enabled: the reporting team uploads with its own logins.
local_enable=YES
secure_chroot_dir=/usr/share/empty
nopriv_user=nobody
dirmessage_enable=YES
xferlog_enable=NO
background=NO
